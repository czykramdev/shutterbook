<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset password · ShutterBook</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f7f5f0;color:#191916;font:15px/1.5 system-ui,sans-serif}.card{width:min(440px,calc(100% - 32px));background:white;border:1px solid #e5e1d8;border-radius:22px;padding:28px}h1{margin:0 0 8px;letter-spacing:-1px}p{color:#77766f;margin:0 0 22px}.field{display:grid;gap:7px;margin:15px 0}.field label{font-size:12px;font-weight:800}.field input{border:1px solid #e5e1d8;border-radius:12px;padding:12px;font:inherit}.btn{width:100%;border:0;border-radius:100px;padding:13px;background:#d7f36a;font-weight:800;font:inherit;cursor:pointer}.msg{margin-top:14px;white-space:pre-wrap;color:#77766f;font-size:13px}
</style>
</head><body><main class="card"><h1>Set a new password</h1><p>Choose a new password for your ShutterBook account.</p>
<form id="form"><div class="field"><label for="password">NEW PASSWORD</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="At least 8 characters"></div><div class="field"><label for="confirm">CONFIRM PASSWORD</label><input id="confirm" type="password" minlength="8" autocomplete="new-password" required placeholder="Enter it again"></div><button class="btn" id="submit">Update password</button><div class="msg" id="msg"></div></form></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const sb=supabase.createClient("https://gwjkfiiknvsdoedhwfgh.supabase.co","eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd3amtmaWlrbnZzZG9lZGh3ZmdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzMzA1ODYsImV4cCI6MjEwODkwNjU4Nn0.1i-KQpuog18J_quBdk2RhX9ZaDR7RmDQah0oaWOyfcE");
const msg=document.querySelector("#msg"),form=document.querySelector("#form"),button=document.querySelector("#submit");
(async()=>{const {data,error}=await sb.auth.getSession();if(error||!data.session){msg.textContent="Recovery session missing or expired. Request a fresh password reset email and open its link.";button.disabled=true;}})();
form.addEventListener("submit",async e=>{e.preventDefault();const p=document.querySelector("#password").value,c=document.querySelector("#confirm").value;if(p!==c){msg.textContent="Passwords do not match.";return}button.disabled=true;msg.textContent="Updating…";const {error}=await sb.auth.updateUser({password:p});if(error){msg.textContent=error.message;button.disabled=false;return}msg.textContent="Password updated. Go to the admin dashboard and sign in.";form.reset();});
</script></body></html>
